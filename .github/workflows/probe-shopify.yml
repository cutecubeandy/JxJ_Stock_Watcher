name: Probe Shopify checkout feasibility

on:
  push:
    paths:
      - ".github/workflows/probe-shopify.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe cart permalink behavior
        run: |
          python3 - <<'PY'
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          variants = [
              ("Daydreamers", "62347455922546"),
              ("Dreamchasers", "62347455988082"),
          ]

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect)

          for name, vid in variants:
              print("===", name, "===")
              for suffix in ["?storefront=true", ""]:
                  url = f"https://seventeenshopus.com/cart/{vid}:1{suffix}"
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  try:
                      with opener.open(req, timeout=20) as r:
                          body = r.read(300).decode("utf-8", "replace")
                          print("URL", url)
                          print("HTTP", r.status)
                          print("Location", r.headers.get("Location"))
                          print("Body", body.replace("\n"," ")[:180])
                  except HTTPError as e:
                      body = e.read(300).decode("utf-8", "replace")
                      print("URL", url)
                      print("HTTP", e.code)
                      print("Location", e.headers.get("Location"))
                      print("Body", body.replace("\n"," ")[:180])
          PY
