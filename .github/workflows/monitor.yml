name: Validate JxJ signed stock

on:
  workflow_dispatch:
  push:
    paths:
      - "stock_checker.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/scheduled-monitor.yml"

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_ENABLED: ${{ vars.HEARTBEAT_ENABLED }}
        run: python3 stock_checker.py

      - name: Save stock state when it changes
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git push
          else
            echo "Stock state did not change."
          fi
