name: Validate JxJ signed stock

on:
  workflow_dispatch:
  push:
    paths:
      - "stock_checker.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/scheduled-monitor.yml"

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate stock checker
        env:
          VALIDATION_ONLY: "true"
        run: python3 stock_checker.py
