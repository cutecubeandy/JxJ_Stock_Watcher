name: Monitor JxJ signed stock

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-stock:
    # Scheduled runs stay disabled until MONITORING_ENABLED=true is added
    # under Settings -> Secrets and variables -> Actions -> Variables.
    # Manual runs are always allowed for setup/testing.
    if: github.event_name == 'workflow_dispatch' || vars.MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 stock_checker.py

      - name: Save stock state when it changes
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git push
          else
            echo "Stock state did not change."
          fi
