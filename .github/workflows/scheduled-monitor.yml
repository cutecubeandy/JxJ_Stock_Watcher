name: Scheduled JxJ stock monitor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Show trigger
        run: echo "Triggered by: ${{ github.event_name }}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_ENABLED: ${{ vars.HEARTBEAT_ENABLED }}
        run: python3 stock_checker.py

      - name: Save stock state when it changes
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git push
          else
            echo "Stock state did not change."
          fi
