name: Check monitoring variables

on:
  push:
    paths:
      - ".github/workflows/check-vars.yml"

jobs:
  check-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Print variable status
        env:
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED }}
          HEARTBEAT_ENABLED: ${{ vars.HEARTBEAT_ENABLED }}
        run: |
          if [ "$MONITORING_ENABLED" = "true" ]; then
            echo "MONITORING_ENABLED=true"
          elif [ -z "$MONITORING_ENABLED" ]; then
            echo "MONITORING_ENABLED=unset"
          else
            echo "MONITORING_ENABLED=other"
          fi

          if [ "$HEARTBEAT_ENABLED" = "true" ]; then
            echo "HEARTBEAT_ENABLED=true"
          elif [ -z "$HEARTBEAT_ENABLED" ]; then
            echo "HEARTBEAT_ENABLED=unset"
          else
            echo "HEARTBEAT_ENABLED=other"
          fi
